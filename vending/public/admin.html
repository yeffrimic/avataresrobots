<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Máquina · Administración</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <!-- Acceso con PIN -->
  <div id="login" class="login">
    <form id="loginForm" class="card login-card">
      <h1>Administración de la máquina</h1>
      <p class="muted">Ingresa el PIN de administración (variable ADMIN_PIN).</p>
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" required />
      <button class="btn primary" type="submit">Entrar</button>
      <p id="loginError" class="error" hidden></p>
    </form>
  </div>

  <div id="app" hidden>
    <header class="top">
      <div class="brand">
        <span class="dot" id="machineDot"></span>
        <div>
          <strong>Máquina expendedora</strong>
          <span class="muted" id="machineText">—</span>
        </div>
      </div>
      <nav class="tabs" id="tabs">
        <button data-tab="resumen" class="on">Resumen</button>
        <button data-tab="inventario">Inventario</button>
        <button data-tab="productos">Productos</button>
        <button data-tab="ventas">Ventas</button>
        <button data-tab="codigos">Códigos de pago</button>
        <button data-tab="probar">Probar</button>
        <button data-tab="config">Configuración</button>
      </nav>
      <button class="btn ghost small" id="logout">Salir</button>
    </header>

    <main>
      <section data-panel="resumen" id="pResumen"></section>
      <section data-panel="inventario" id="pInventario" hidden></section>
      <section data-panel="productos" id="pProductos" hidden></section>
      <section data-panel="ventas" id="pVentas" hidden></section>
      <section data-panel="codigos" id="pCodigos" hidden></section>
      <section data-panel="probar" id="pProbar" hidden></section>
      <section data-panel="config" id="pConfig" hidden></section>
    </main>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script type="module" src="admin.js"></script>
</body>
</html>
